name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=cover.out .
      - name: Coverage gate (100%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ] || { echo "coverage must be 100.0%"; exit 1; }
